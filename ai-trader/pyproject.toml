[project]
name = "ai-trader"
version = "0.1.0"
description = "Safe Phase 1 scaffolding for an AI-driven Indian-market paper trading system"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "structlog>=24.4",
  "uvicorn[standard]>=0.32",
  "websockets>=14.0",
  "protobuf>=5.0",
  "boto3>=1.43.114",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20",
  "grpcio-tools>=1.68",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "types-protobuf>=5.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trader"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# Generated protobuf module: do not edit or reformat.
"src/ai_trader/integrations/upstox/protobuf/MarketDataFeed_pb2.py" = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

# The generated protobuf module builds message classes dynamically at runtime,
# so static analyzers cannot see its attributes. It is excluded from strict typing.
[[tool.mypy.overrides]]
module = "ai_trader.integrations.upstox.protobuf.MarketDataFeed_pb2"
ignore_errors = true
follow_imports = "skip"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
