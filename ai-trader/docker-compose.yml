services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_trader
      POSTGRES_USER: ai_trader
      POSTGRES_PASSWORD: ai_trader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_trader -d ai_trader"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
